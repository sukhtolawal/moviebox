version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: dockerized/backend/Dockerfile
    container_name: dec-backend
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount token if present (optional)
      - ../token.txt:/app/../token.txt:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: dockerized/frontend/Dockerfile
    container_name: dec-frontend
    network_mode: host
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://localhost:5001
    restart: unless-stopped

